<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | EventHub</title>

    <link rel="stylesheet" href="css/signup.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

</head>

<body>

<div class="background-circle one"></div>
<div class="background-circle two"></div>

<div class="login-container">

    <div class="left-side">

        <h1>Welcome Back 👋</h1>

        <p>

            Login to discover amazing events,
            manage your bookings,
            and stay connected with your community.

        </p>

        <img src="image/login.png" alt="Login Illustration">

    </div>

    <div class="right-side">

        <form id="loginForm">

            <h2>Login</h2>

            <p class="subtitle">

                Sign in to your account

            </p>

            <div class="input-group">

                <span class="material-symbols-outlined">

                    mail

                </span>

                <input

                type="email"

                id="email"

                placeholder="Email Address"

                >

            </div>

            <small id="emailError"></small>

            <div class="input-group">

                <span class="material-symbols-outlined">

                    lock

                </span>

                <input

                type="password"

                id="password"

                placeholder="Password"

                >

                <span

                class="material-symbols-outlined eye"

                id="togglePassword">

                    visibility

                </span>

            </div>

            <small id="passwordError"></small>

            <div class="options">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="#">

                    Forgot Password?

                </a>

            </div>

            <button type="submit">

                Login

            </button>

            <p class="signup">

                Don't have an account?

                <a href="Signup.html">

                    Create One

                </a>

            </p>

        </form>

    </div>

</div>

<script src="js/login.js"></script>

</body>

</html>
