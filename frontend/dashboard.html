<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <aside class="sidebar">
        <h2>Dashboard</h2>
        <ul>
            <li><a href="#"> Home</a></li>
            <li><a href="#"> Users</a></li>
            <li><a href="#">Analytics</a></li>
            <li><a href="#">Reports</a></li>
            <li><a href="#">Settings</a></li>
            <li><a href="#">Logout</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <header class="header">
            <h1>Welcome, Admin</h1>
            <button>Profile</button>
        </header>

        <!-- Cards -->
        <section class="cards">
            <div class="card">
                <h3>Total Users</h3>
                <p>1,245</p>
            </div>

            <div class="card">
                <h3>Revenue</h3>
                <p>$12,540</p>
            </div>

            <div class="card">
                <h3>Orders</h3>
                <p>350</p>
            </div>

            <div class="card">
                <h3>Messages</h3>
                <p>28</p>
            </div>
        </section>

        <!-- Table -->
        <section class="table-section">
            <h2>Recent Orders</h2>

            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Status</th>
                        <th>Amount</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>#1001</td>
                        <td>John</td>
                        <td>Completed</td>
                        <td>$120</td>
                    </tr>

                    <tr>
                        <td>#1002</td>
                        <td>Emma</td>
                        <td>Pending</td>
                        <td>$85</td>
                    </tr>

                    <tr>
                        <td>#1003</td>
                        <td>David</td>
                        <td>Completed</td>
                        <td>$220</td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

</div>

</body>
</html>
